[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-arb-backtest"
version = "0.1.0"
description = "ETF creation/redemption arbitrage backtest framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7", "pyarrow>=15", "tzdata; sys_platform == 'win32'"]

[project.scripts]
etf-arb = "etf_arb.cli:main"

[tool.setuptools.packages.find]
include = ["etf_arb*"]
